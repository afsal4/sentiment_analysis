{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
      <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
      <link rel="stylesheet" href="{% static 'sentiment.css' %}">
    <style>
        /* chart + its color blocks live side by side inside this box */
        .chart-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }
        .chart-legend {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            /* hidden until the chart finishes, then fades + slides in */
            opacity: 0;
            transform: translateX(12px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .chart-legend.show .legend-item {
            opacity: 1;
            transform: translateX(0);
        }
        .legend-box {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            display: inline-block;
            flex-shrink: 0;
        }
    </style>
    <script>
        // Custom plugin: draws outside labels with a leader line (like CanvasJS index labels).
        // Only draws once the entry animation has finished (chart.$labelsReady).
        var OutsideLabels = {
            id: "outsideLabels",
            afterDraw: function (chart) {
                if (!chart.$labelsReady) { return; }
                var ctx = chart.ctx;
                var meta = chart.getDatasetMeta(0);
                ctx.save();
                // fade the labels + lines in slowly instead of popping in
                ctx.globalAlpha = chart.$labelAlpha == null ? 1 : chart.$labelAlpha;
                meta.data.forEach(function (arc, i) {
                    var value = chart.data.datasets[0].data[i];
                    var text = chart.data.labels[i] + " (" + value + ")";
                    var angle = (arc.startAngle + arc.endAngle) / 2;
                    var cos = Math.cos(angle);
                    var sin = Math.sin(angle);
                    var onRight = cos >= 0;

                    // start at the slice edge, kink outward, then run horizontally
                    var x1 = arc.x + cos * arc.outerRadius;
                    var y1 = arc.y + sin * arc.outerRadius;
                    var x2 = arc.x + cos * (arc.outerRadius + 14);
                    var y2 = arc.y + sin * (arc.outerRadius + 14);
                    var x3 = x2 + (onRight ? 24 : -24);

                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.lineTo(x3, y2);
                    ctx.strokeStyle = "#000000";
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    ctx.fillStyle = "#000000";
                    ctx.font = "13px sans-serif";
                    ctx.textBaseline = "middle";
                    ctx.textAlign = onRight ? "left" : "right";
                    ctx.fillText(text, x3 + (onRight ? 4 : -4), y2);
                });
                ctx.restore();
            }
        };

        window.onload = function () {
        var pieData = {{ pie_out|safe }};
        // Check if the data is available
        if (pieData && pieData.length > 0) {
            // CanvasJS default palette colors so the look stays identical
            var palette = ["#369EAD", "#C24642", "#7F6084", "#86B402", "#A2D1CF", "#B3AD9E", "#52514E", "#C8D4E3", "#B7B83F", "#C8385A"];

            var labels = pieData.map(function (d) { return d.label; });
            var values = pieData.map(function (d) { return d.y; });
            var colors = pieData.map(function (d, i) { return palette[i % palette.length]; });

            // build the Positive/Negative color blocks as HTML (outside the chart)
            var legendEl = document.getElementById("chartLegend");
            if (legendEl) {
                labels.forEach(function (label, i) {
                    var item = document.createElement("div");
                    item.className = "legend-item";
                    item.style.transitionDelay = (i * 0.15) + "s";
                    var box = document.createElement("span");
                    box.className = "legend-box";
                    box.style.backgroundColor = colors[i];
                    var txt = document.createElement("span");
                    txt.textContent = label;
                    item.appendChild(box);
                    item.appendChild(txt);
                    legendEl.appendChild(item);
                });
            }

            var ctx = document.getElementById("chartCanvas").getContext("2d");
            new Chart(ctx, {
                type: "pie",
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: colors,
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    // leave room around the pie for the outside labels + leader lines
                    layout: { padding: { top: 35, bottom: 35, left: 130, right: 130 } },
                    animation: {
                        animateRotate: true,
                        animateScale: false,
                        onComplete: function () {
                            var chart = this;
                            if (chart.$labelsReady) { return; }
                            chart.$labelsReady = true;
                            // fade the outside labels in over ~700ms
                            var duration = 700;
                            var startTs = null;
                            function fadeStep(ts) {
                                if (startTs === null) { startTs = ts; }
                                var t = Math.min((ts - startTs) / duration, 1);
                                chart.$labelAlpha = t;
                                chart.draw();
                                if (t < 1) { requestAnimationFrame(fadeStep); }
                            }
                            requestAnimationFrame(fadeStep);
                            // reveal the HTML legend (color blocks) once the pie is drawn
                            var legendEl = document.getElementById("chartLegend");
                            if (legendEl) { legendEl.classList.add("show"); }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function (context) {
                                    return context.label + ": " + context.parsed + "%";
                                }
                            }
                        }
                    }
                },
                plugins: [OutsideLabels]
            });
        } else {
            console.error("No data available for the chart.");
        }
    };
      </script>
</head>
<body>
    <div class="header-box">
        <h1>Sentiment Analysis</h1>
    </div>
    <div class="navbar container">
        <button class="nav-button active" onclick="setActive(this, 'Encoder')">Encoder</button>
        <button class="nav-button" onclick="setActive(this, 'LSTM')">LSTM</button>
    </div>
    {% if sentence is not None %}
    <div class="container sentence-box">{{sentence}}</div>
    
    <div class="sentiment-box container">
        <div class="sentiment-sub fd-c">
            <table class="table table-bordered">
                <tr>
                    <th>Sentiment</th>
                    <td>{{sentiment}}</td>
                </tr>
                <tr>
                    <th>Tokens used</th>
                    <td>{{tkn_usd}}</td>
                </tr>
                <tr>
                    <th colspan="2"><a href="https://github.com/afsal4/sentiment_analysis">GitHub Link</a></th>
                </tr>
            </table>
        </div>
        <div class="sentiment-sub">
            <div class="chart-area">
                <div id="chartContainer" style="height: 360px; width: 100%; max-width: 520px;">
                    <canvas id="chartCanvas"></canvas>
                </div>
                <div id="chartLegend" class="chart-legend"></div>
            </div>
        </div>
    </div>
    {% else %}
    <div class="container sentence-box">Please Enter a sentence in the input box to find the sentiment</div>
    {% endif %}

    <div class="input-chat">
        <div class="flex-grow-0 py-3 border-top">
            <form action="" method="post">
                {% csrf_token %}
                <div class="input-group container">
                    <input type="text" class="form-control" placeholder="type the sentence" name="s-text">
                    <input type="hidden" id="selected-model" name="model" value="Encoder">
                    <button class="btn btn-primary" type="submit">Submit</button>
                </div>
            </form>
        </div>
    </div>



    <!-- <script src="{% static 'script.js' %}"></script> -->
    <script>
        function setActive(button, model) {
            const buttons = document.querySelectorAll('.nav-button');
            buttons.forEach(btn => {
                btn.classList.remove('active');
            });
            button.classList.add('active');
            document.getElementById('selected-model').value = model; // Set the hidden input value
        }
    </script>
</body>
</html>
